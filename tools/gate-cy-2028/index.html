<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GATE CY 2028 — Daily Capsule</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div class="brand">GATE&nbsp;CY <small>Chemistry · 2028</small></div>
        <div class="stats">
          <div class="stat">
            <b id="stat-days-left">0</b><span>Days Left</span>
          </div>
          <div class="stat">
            <b id="stat-streak">0</b><span>Day streak</span>
          </div>
          <div class="stat"><b id="stat-done">0</b><span>Completed</span></div>
          <div class="stat">
            <b id="stat-cycle">Round 1</b><span>Pass</span>
          </div>
        </div>
      </div>

      <div class="app-layout">
        <main class="main-content">
          <div id="card-stage">
            <div id="hero-card"></div>
          </div>

          <div class="week-strip-wrap">
            <div id="week-strip"></div>
          </div>

          <div class="roadmap-toggle-wrap">
            <button id="toggle-roadmap" aria-expanded="false">
              See full roadmap
            </button>
          </div>

          <div id="roadmap-panel">
            <div id="roadmap"></div>
          </div>
        </main>

        <aside class="side-panel">
          <div class="calendar-card">
            <div class="cal-banner">
              <div class="cal-banner-icon">🎯</div>
              <div class="cal-banner-text">
                <span class="cal-banner-title">Target Exam Date</span>
                <span class="cal-banner-sub"
                  >Feb 3, 2028 · <strong id="banner-days-left">0</strong> days
                  left</span
                >
              </div>
            </div>
            <div class="cal-header">
              <button id="cal-prev" title="Previous Month">&lsaquo;</button>
              <span id="cal-month-year">August 2026</span>
              <button id="cal-next" title="Next Month">&rsaquo;</button>
            </div>
            <div class="cal-legend">
              <span class="legend-item legend-today"
                ><i class="dot"></i> Today</span
              >
              <span class="legend-item legend-done"
                ><i class="dot"></i> Done</span
              >
              <span class="legend-item legend-skipped"
                ><i class="dot"></i> Skipped</span
              >
            </div>
            <div class="cal-weekdays">
              <span>Su</span><span>Mo</span><span>Tu</span><span>We</span
              ><span>Th</span><span>Fr</span><span>Sa</span>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
          </div>
        </aside>
      </div>

      <footer class="site-footer">
        <div class="footer-divider"></div>
        <div class="footer-inner">
          <div class="footer-copy">&copy; Alok Das</div>
          <button
            id="nav-home"
            class="btn-footer-nav"
            title="Navigate to Today's Topic"
          >
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Home</span>
          </button>
          <a
            href="https://alokdasofficial.in"
            id="nav-portfolio"
            class="btn-footer-nav btn-portfolio"
            title="Back to Portfolio Site"
          >
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Portfolio</span>
          </a>
        </div>
      </footer>
    </div>

    <script src="content.js"></script>
    <script src="app.js"></script>
  </body>
</html>
