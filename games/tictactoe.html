<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Tic-Tac-Toe — Alok Das Game Zone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  
  <style>
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 2.5rem;
    }
    .game-nav {
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      height: var(--nav-height);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      margin-bottom: 2rem;
    }
    .game-wrapper {
      max-width: 440px;
      width: 100%;
      padding: 0 1rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .arcade-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-pop);
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }
    .game-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .game-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .game-title-text {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
    }
    .score-badge-group {
      display: flex;
      gap: 8px;
    }
    .score-pill {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 12px;
      color: var(--text2);
    }
    .score-pill span {
      color: var(--text);
      font-weight: 600;
      margin-left: 4px;
    }
    
    .mode-toggle-bar {
      display: flex;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: 20px;
      margin-bottom: 1.25rem;
    }
    .mode-btn {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 16px;
      border: none;
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-btn.active {
      background: var(--accent);
      color: var(--bg);
      font-weight: 500;
    }
    
    .status-msg {
      font-family: var(--font-mono);
      font-size: 0.88rem;
      color: var(--text2);
      margin-bottom: 1.25rem;
      min-height: 1.5rem;
      text-align: center;
    }
    
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 290px;
      height: 290px;
      margin-bottom: 1.5rem;
    }
    .cell {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 2.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
      user-select: none;
      color: var(--text);
    }
    .cell:hover:not(.taken) {
      background: var(--surface);
      border-color: var(--border-hover);
      transform: scale(1.02);
    }
    .cell.taken { cursor: default; }
    .cell.win-cell {
      background: var(--surface);
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }
    
    .btn-action {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
      background: var(--accent);
      color: var(--bg);
      padding: 10px 22px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .btn-action:hover { opacity: 0.9; }
  </style>
</head>
<body>

<nav class="game-nav">
  <a href="/games" class="nav-logo">
    ALOK DAS <span class="nav-logo-tag">/ TIC-TAC-TOE</span>
  </a>
  <div class="nav-right-group">
    <a href="/games" class="header-back" title="Back to Games">← <span>Games</span></a>
    <button class="theme-toggle-btn" id="themeBtn" title="Toggle theme">☾</button>
  </div>
</nav>

<div class="game-wrapper">
  <div class="arcade-card">
    <div class="game-header">
      <div class="game-title-group">
        <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="3" y1="15" x2="21" y2="15"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
          <line x1="15" y1="3" x2="15" y2="21"/>
        </svg>
        <span class="game-title-text">Tic-Tac-Toe</span>
      </div>
      <div class="score-badge-group">
        <div class="score-pill">You(X)<span id="sx">0</span></div>
        <div class="score-pill">Draw<span id="sd">0</span></div>
        <div class="score-pill">CPU(O)<span id="so">0</span></div>
      </div>
    </div>

    <div class="mode-toggle-bar">
      <button class="mode-btn active" id="m-easy">Easy Mode</button>
      <button class="mode-btn" id="m-hard">Smart AI</button>
    </div>

    <div class="status-msg" id="msg">Your Turn (X)</div>
    <div class="board" id="board"></div>
    <button class="btn-action" id="restart">↺ Reset Game</button>
  </div>
</div>

<script>
var WINS=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
var board=Array(9).fill(''),gameOver=false,mode='easy',scores={x:0,d:0,o:0};
var sxEl=document.getElementById('sx'),sdEl=document.getElementById('sd'),soEl=document.getElementById('so'),msgEl=document.getElementById('msg');
var cells=[];

document.getElementById('m-easy').addEventListener('click',function(){mode='easy';setMode(this);});
document.getElementById('m-hard').addEventListener('click',function(){mode='hard';setMode(this);});
function setMode(btn){
  document.querySelectorAll('.mode-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  reset();
}

function buildBoard(){
  var el=document.getElementById('board');el.innerHTML='';cells=[];
  for(var i=0;i<9;i++){
    (function(idx){
      var c=document.createElement('div');c.className='cell';
      c.addEventListener('click',function(){playerMove(idx);});
      el.appendChild(c);cells.push(c);
    })(i);
  }
}

function render(){
  cells.forEach(function(c,i){
    c.textContent=board[i];
    c.className='cell'+(board[i]?' taken '+board[i]:'');
  });
}

function checkWin(b,p){
  return WINS.find(function(line){return line.every(function(i){return b[i]===p;});});
}

function playerMove(idx){
  if(gameOver||board[idx])return;
  board[idx]='X';render();
  var w=checkWin(board,'X');
  if(w){finish('X',w);return;}
  if(board.every(function(v){return v;})){finish(null);return;}
  msgEl.textContent='CPU Thinking (O)…';
  setTimeout(cpuMove,320);
}

function cpuMove(){
  var idx=mode==='hard'?bestMove():randomOrBlock();
  if(idx===-1)return;
  board[idx]='O';render();
  var w=checkWin(board,'O');
  if(w){finish('O',w);return;}
  if(board.every(function(v){return v;})){finish(null);return;}
  msgEl.textContent='Your Turn (X)';
}

function randomOrBlock(){
  for(var i=0;i<9;i++){
    if(!board[i]){var t=board.slice();t[i]='X';if(checkWin(t,'X'))return i;}
  }
  var empty=board.reduce(function(a,v,i){if(!v)a.push(i);return a;},[]);
  return empty[Math.floor(Math.random()*empty.length)]||-1;
}

function bestMove(){
  for(var i=0;i<9;i++){if(!board[i]){var t=board.slice();t[i]='O';if(checkWin(t,'O'))return i;}}
  for(var i=0;i<9;i++){if(!board[i]){var t=board.slice();t[i]='X';if(checkWin(t,'X'))return i;}}
  if(!board[4])return 4;
  var corners=[0,2,6,8].filter(function(i){return !board[i];});
  if(corners.length)return corners[Math.floor(Math.random()*corners.length)];
  return randomOrBlock();
}

function finish(winner,line){
  gameOver=true;
  if(winner){
    scores[winner.toLowerCase()]++;
    line.forEach(function(i){cells[i].classList.add('win-cell');});
    msgEl.textContent=winner==='X'?'🎉 YOU WIN!':'💻 CPU WINS!';
  } else {
    scores.d++;
    msgEl.textContent="🤝 IT'S A DRAW!";
  }
  sxEl.textContent=scores.x;sdEl.textContent=scores.d;soEl.textContent=scores.o;
}

function reset(){board=Array(9).fill('');gameOver=false;msgEl.textContent='Your Turn (X)';buildBoard();render();}
document.getElementById('restart').addEventListener('click',reset);

/* Theme Setup */
let darkMode = localStorage.getItem('alok-theme-dark') === 'true';
const themeBtn = document.getElementById('themeBtn');
function setTheme() {
  document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
  if (themeBtn) themeBtn.textContent = darkMode ? '☀' : '☾';
  localStorage.setItem('alok-theme-dark', darkMode);
}
if (themeBtn) {
  themeBtn.addEventListener('click', function () {
    darkMode = !darkMode;
    setTheme();
  });
}
setTheme();
buildBoard();
</script>
<script src="/js/firebase-tracker.js"></script>
</body>
</html>
