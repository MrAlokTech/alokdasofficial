<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Beaker — Alok Das Game Zone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  
  <style>
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 2.5rem;
      user-select: none;
      -webkit-user-select: none;
    }
    .game-nav {
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      height: var(--nav-height);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      margin-bottom: 2rem;
    }
    .game-wrapper {
      max-width: 440px;
      width: 100%;
      padding: 0 1rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .arcade-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-pop);
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }
    .game-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .game-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .game-title-text {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
    }
    .score-badge-group {
      display: flex;
      gap: 12px;
    }
    .score-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 12px;
      color: var(--text2);
    }
    .score-pill span {
      color: var(--text);
      font-weight: 600;
      margin-left: 4px;
    }
    
    .canvas-frame {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: 440px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface2);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.06);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }
    
    .game-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 1.5rem;
    }
    .overlay-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .overlay-sub {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: rgba(255,255,255,0.75);
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }
    .btn-action {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
      background: #ffffff;
      color: #111110;
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .btn-action:hover { opacity: 0.9; }
    
    .instructions {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text3);
      margin-top: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <nav class="game-nav">
    <a href="/games" class="nav-logo">
      ALOK DAS <span class="nav-logo-tag">/ FLAPPY BEAKER</span>
    </a>
    <div class="nav-right-group">
      <a href="/games" class="header-back" title="Back to Games">← <span>Games</span></a>
      <button class="theme-toggle-btn" id="themeBtn" title="Toggle theme">☾</button>
    </div>
  </nav>

  <div class="game-wrapper">
    <div class="arcade-card">
      <div class="game-header">
        <div class="game-title-group">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 2v7.5L4.5 18a2 2 0 0 0 1.7 3h11.6a2 2 0 0 0 1.7-3L14 9.5V2"/>
            <path d="M8.5 2h7"/>
            <path d="M7 16h10"/>
          </svg>
          <span class="game-title-text">Flappy Beaker</span>
        </div>
        <div class="score-badge-group">
          <div class="score-pill">Score<span id="score">0</span></div>
          <div class="score-pill">Best<span id="best">0</span></div>
        </div>
      </div>

      <div class="canvas-frame">
        <canvas id="c" width="360" height="440"></canvas>

        <!-- Start Overlay -->
        <div class="game-overlay" id="start-overlay">
          <div class="overlay-title">Flappy Beaker</div>
          <div class="overlay-sub">Steer the chemical beaker through fume hood columns! Tap or Spacebar to bounce.</div>
          <button class="btn-action" id="start-btn">Start Assay →</button>
        </div>

        <!-- Game Over Overlay -->
        <div class="game-overlay" id="over-overlay" style="display:none;">
          <div class="overlay-title">Beaker Cracked!</div>
          <div class="overlay-sub" id="over-score-text">Contamination: 0 ppm</div>
          <button class="btn-action" id="restart-btn">Retry Run ↺</button>
        </div>
      </div>

      <div class="instructions">Press Spacebar or Tap Screen to Bounce</div>
    </div>
  </div>

<script>
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
var startOverlay=document.getElementById('start-overlay'),overOverlay=document.getElementById('over-overlay'),overScoreText=document.getElementById('over-score-text');
var startBtn=document.getElementById('start-btn'),restartBtn=document.getElementById('restart-btn');

var best=parseInt(localStorage.getItem('beaker_best')||'0');
bestEl.textContent=best;

var audioCtx = null;
function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    var now = audioCtx.currentTime;
    
    if (type === 'flap') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(320, now + 0.12);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === 'score') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.setValueAtTime(784, now + 0.08);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
      osc.start(now);
      osc.stop(now + 0.22);
    } else if (type === 'crash') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.linearRampToValueAtTime(40, now + 0.4);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
      osc.start(now);
      osc.stop(now + 0.4);
    }
  } catch (e) {}
}

var GRAVITY = 0.32;
var FLAP_STRENGTH = -5.8;
var PIPE_SPEED = 2.1;
var PIPE_SPAWN_RATE = 110;
var PIPE_GAP = 135;
var PIPE_WIDTH = 64;

var beaker, pipes, score, state, frameCount, loopId;

function initGame() {
  beaker = {
    x: 75,
    y: 200,
    velocity: 0,
    radius: 16,
    angle: 0
  };
  pipes = [];
  score = 0;
  scoreEl.textContent = 0;
  frameCount = 0;
  state = 'start';
}

function spawnPipe() {
  var minH = 50;
  var maxH = canvas.height - PIPE_GAP - minH;
  var topH = Math.floor(Math.random() * (maxH - minH + 1)) + minH;
  pipes.push({
    x: canvas.width,
    topHeight: topH,
    bottomHeight: canvas.height - topH - PIPE_GAP,
    passed: false
  });
}

function bounce() {
  if (state === 'playing') {
    beaker.velocity = FLAP_STRENGTH;
    playSound('flap');
  }
}

function update() {
  if (state !== 'playing') return;
  
  frameCount++;
  beaker.velocity += GRAVITY;
  beaker.y += beaker.velocity;
  beaker.angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 8, beaker.velocity * 0.06));
  
  if (beaker.y - beaker.radius < 0 || beaker.y + beaker.radius > canvas.height) {
    endGame();
    return;
  }
  
  if (frameCount % PIPE_SPAWN_RATE === 0) {
    spawnPipe();
  }
  
  for (var i = pipes.length - 1; i >= 0; i--) {
    var p = pipes[i];
    p.x -= PIPE_SPEED;
    
    var inX = (beaker.x + beaker.radius > p.x && beaker.x - beaker.radius < p.x + PIPE_WIDTH);
    var hitTop = inX && (beaker.y - beaker.radius < p.topHeight);
    var hitBottom = inX && (beaker.y + beaker.radius > canvas.height - p.bottomHeight);
    
    if (hitTop || hitBottom) {
      endGame();
      return;
    }
    
    if (!p.passed && p.x + PIPE_WIDTH < beaker.x) {
      p.passed = true;
      score++;
      scoreEl.textContent = score;
      playSound('score');
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('beaker_best', best);
      }
    }
    
    if (p.x + PIPE_WIDTH < 0) {
      pipes.splice(i, 1);
    }
  }
}

function draw() {
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  ctx.fillStyle = isDark ? '#1c1c1a' : '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Grid background
  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.04)';
  var gridSize = 20;
  for (var x = 0; x < canvas.width; x += gridSize) {
    for (var y = 0; y < canvas.height; y += gridSize) {
      ctx.beginPath();
      ctx.arc(x + gridSize/2, y + gridSize/2, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  
  // Draw pipes
  pipes.forEach(function (p) {
    ctx.fillStyle = isDark ? '#333330' : '#e5e2da';
    ctx.strokeStyle = isDark ? '#555350' : '#8a8880';
    ctx.lineWidth = 1;
    
    // Top Column
    ctx.beginPath();
    ctx.roundRect(p.x, -10, PIPE_WIDTH, p.topHeight + 10, [0, 0, 8, 8]);
    ctx.fill(); ctx.stroke();
    
    // Bottom Column
    ctx.beginPath();
    ctx.roundRect(p.x, canvas.height - p.bottomHeight, PIPE_WIDTH, p.bottomHeight + 10, [8, 8, 0, 0]);
    ctx.fill(); ctx.stroke();
  });
  
  // Draw Beaker
  ctx.save();
  ctx.translate(beaker.x, beaker.y);
  ctx.rotate(beaker.angle);
  
  ctx.fillStyle = isDark ? '#f0eeea' : '#111110';
  ctx.beginPath();
  ctx.roundRect(-14, -2, 28, 18, [0, 0, 10, 10]);
  ctx.fill();
  
  ctx.strokeStyle = isDark ? '#f0eeea' : '#111110';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(-16, -18, 32, 36, [0, 0, 12, 12]);
  ctx.stroke();
  
  ctx.fillRect(-20, -21, 40, 3);
  ctx.restore();
}

function gameTick() {
  update();
  draw();
  loopId = requestAnimationFrame(gameTick);
}

function startGame() {
  initGame();
  state = 'playing';
  startOverlay.style.display = 'none';
  overOverlay.style.display = 'none';
  playSound('flap');
  if (typeof window.trackEvent === 'function') {
    window.trackEvent('game_start', 'Flappy Beaker', null);
  }
}

function endGame() {
  state = 'gameover';
  playSound('crash');
  overScoreText.textContent = 'Contamination Score: ' + score;
  overOverlay.style.display = 'flex';
  if (typeof window.trackEvent === 'function') {
    window.trackEvent('game_over', 'Flappy Beaker', { score: score });
  }
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

window.addEventListener('keydown', function (e) {
  if (e.key === ' ' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (state === 'start') startGame();
    else if (state === 'playing') bounce();
    else if (state === 'gameover') startGame();
  }
});

canvas.addEventListener('click', function (e) {
  e.preventDefault();
  if (state === 'playing') bounce();
});

canvas.addEventListener('touchstart', function (e) {
  e.preventDefault();
  if (state === 'playing') bounce();
}, {passive: false});

/* Theme Setup */
let darkMode = localStorage.getItem('alok-theme-dark') === 'true';
const themeBtn = document.getElementById('themeBtn');
function setTheme() {
  document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
  if (themeBtn) themeBtn.textContent = darkMode ? '☀' : '☾';
  localStorage.setItem('alok-theme-dark', darkMode);
  draw();
}
if (themeBtn) {
  themeBtn.addEventListener('click', function () {
    darkMode = !darkMode;
    setTheme();
  });
}

initGame();
setTheme();
gameTick();
</script>
<script src="/js/firebase-tracker.js"></script>
</body>
</html>
