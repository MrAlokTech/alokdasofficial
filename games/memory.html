<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Element Match — Alok Das Game Zone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    
    <style>
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-bottom: 2.5rem;
      }
      .game-nav {
        width: 100%;
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        height: var(--nav-height);
        padding: 0 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-sizing: border-box;
        margin-bottom: 2rem;
      }
      .game-wrapper {
        max-width: 460px;
        width: 100%;
        padding: 0 1rem;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .arcade-card {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        box-shadow: var(--shadow-pop);
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
        position: relative;
      }
      .game-header {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.25rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid var(--border);
      }
      .game-title-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .game-title-text {
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--text);
      }
      .score-badge-group {
        display: flex;
        gap: 8px;
      }
      .score-pill {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background: var(--surface2);
        border: 1px solid var(--border);
        padding: 4px 8px;
        border-radius: 12px;
        color: var(--text2);
      }
      .score-pill span {
        color: var(--text);
        font-weight: 600;
        margin-left: 4px;
      }

      /* Memory Grid */
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.6rem;
        width: 100%;
        margin-bottom: 1.25rem;
      }
      .card {
        aspect-ratio: 1;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 12px;
        cursor: pointer;
        position: relative;
        perspective: 600px;
        transition: transform 0.25s ease, border-color 0.25s ease;
      }
      .card:hover:not(.flipped):not(.matched) {
        border-color: var(--border-hover);
        transform: translateY(-2px);
      }
      .card.flipped .inner,
      .card.matched .inner {
        transform: rotateY(180deg);
      }
      .card.matched {
        border-color: var(--text3);
        cursor: default;
        opacity: 0.85;
      }
      .inner {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .front,
      .back {
        position: absolute;
        inset: 0;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        backface-visibility: hidden;
      }
      .front {
        background: var(--surface2);
        font-family: var(--font-mono);
        font-size: 1.2rem;
        color: var(--text3);
      }
      .back {
        background: var(--surface);
        border: 1px solid var(--border);
        transform: rotateY(180deg);
        gap: 2px;
      }
      .back .sym {
        font-family: var(--font-mono);
        font-size: 1.3rem;
        font-weight: 600;
        color: var(--text);
        line-height: 1;
      }
      .back .num {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--text3);
      }
      .back .name {
        font-size: 0.65rem;
        color: var(--text2);
        text-align: center;
        padding: 0 2px;
        line-height: 1.1;
      }

      .btn-action {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 500;
        background: var(--accent);
        color: var(--bg);
        padding: 10px 22px;
        border-radius: 20px;
        border: none;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }
      .btn-action:hover { opacity: 0.9; }

      /* Win Overlay */
      .win-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(4px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        border-radius: var(--radius);
        padding: 1.5rem;
        text-align: center;
      }
      .win-title {
        font-size: 1.6rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      .win-sub {
        font-family: var(--font-mono);
        font-size: 0.85rem;
        color: rgba(255,255,255,0.8);
        margin-bottom: 1.25rem;
      }
    </style>
  </head>
  <body>
    <nav class="game-nav">
      <a href="/games" class="nav-logo">
        ALOK DAS <span class="nav-logo-tag">/ ELEMENT MATCH</span>
      </a>
      <div class="nav-right-group">
        <a href="/games" class="header-back" title="Back to Games">← <span>Games</span></a>
        <button class="theme-toggle-btn" id="themeBtn" title="Toggle theme">☾</button>
      </div>
    </nav>

    <div class="game-wrapper">
      <div class="arcade-card">
        <div class="game-header">
          <div class="game-title-group">
            <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 2v7.5L4.5 18a2 2 0 0 0 1.7 3h11.6a2 2 0 0 0 1.7-3L14 9.5V2"/>
              <path d="M8.5 2h7"/>
              <path d="M7 16h10"/>
            </svg>
            <span class="game-title-text">Element Match</span>
          </div>
          <div class="score-badge-group">
            <div class="score-pill">Moves<span id="moves">0</span></div>
            <div class="score-pill">Pairs<span id="pairs">0/8</span></div>
            <div class="score-pill">Time<span id="timer">0s</span></div>
          </div>
        </div>

        <div class="grid" id="grid"></div>
        <button class="btn-action" id="restart">↺ Reset Game</button>

        <!-- Win Overlay -->
        <div class="win-overlay" id="winOverlay" style="display:none;">
          <div class="win-title">🎉 All Matched!</div>
          <div class="win-sub" id="winStatsText">Completed in 0 moves &amp; 0s!</div>
          <button class="btn-action" id="winRestartBtn" style="background:#ffffff;color:#111110;">Play Again ↺</button>
        </div>
      </div>
    </div>

    <script>
      var ELEMENTS = [
        { sym: "H", num: 1, name: "Hydrogen" },
        { sym: "He", num: 2, name: "Helium" },
        { sym: "Li", num: 3, name: "Lithium" },
        { sym: "C", num: 6, name: "Carbon" },
        { sym: "N", num: 7, name: "Nitrogen" },
        { sym: "O", num: 8, name: "Oxygen" },
        { sym: "Na", num: 11, name: "Sodium" },
        { sym: "K", num: 19, name: "Potassium" },
      ];

      var movesEl = document.getElementById("moves"),
        pairsEl = document.getElementById("pairs"),
        timerEl = document.getElementById("timer"),
        grid = document.getElementById("grid"),
        winOverlay = document.getElementById("winOverlay"),
        winStatsText = document.getElementById("winStatsText"),
        winRestartBtn = document.getElementById("winRestartBtn");
      
      var first = null,
        busy = false,
        matched = 0,
        moves = 0,
        seconds = 0,
        tick = null,
        started = false;

      function shuffle(a) {
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      }

      function build() {
        clearInterval(tick);
        first = null;
        busy = false;
        matched = 0;
        moves = 0;
        seconds = 0;
        started = false;
        movesEl.textContent = 0;
        pairsEl.textContent = "0/8";
        timerEl.textContent = "0s";
        winOverlay.style.display = "none";
        grid.innerHTML = "";
        
        var cards = shuffle(ELEMENTS.concat(ELEMENTS));
        cards.forEach(function (el) {
          var card = document.createElement("div");
          card.className = "card";
          card.innerHTML =
            '<div class="inner"><div class="front">🧪</div><div class="back"><div class="sym">' +
            el.sym +
            '</div><div class="num">#' +
            el.num +
            '</div><div class="name">' +
            el.name +
            "</div></div></div>";
          card.dataset.sym = el.sym;
          card.addEventListener("click", function () {
            flip(card);
          });
          grid.appendChild(card);
        });
      }

      function flip(card) {
        if (
          busy ||
          card.classList.contains("flipped") ||
          card.classList.contains("matched")
        )
          return;
        if (!started) {
          started = true;
          tick = setInterval(function () {
            seconds++;
            timerEl.textContent = seconds + "s";
          }, 1000);
          if (typeof window.trackEvent === 'function') {
            window.trackEvent('game_start', 'Element Match', null);
          }
        }
        card.classList.add("flipped");
        if (!first) {
          first = card;
          return;
        }
        moves++;
        movesEl.textContent = moves;
        if (first.dataset.sym === card.dataset.sym) {
          first.classList.add("matched");
          card.classList.add("matched");
          matched++;
          pairsEl.textContent = matched + "/8";
          first = null;
          if (matched === 8) {
            clearInterval(tick);
            winStatsText.textContent = "Solved in " + moves + " moves and " + seconds + " seconds!";
            winOverlay.style.display = "flex";
            if (typeof window.trackEvent === 'function') {
              window.trackEvent('game_win', 'Element Match', { moves: moves, seconds: seconds });
            }
          }
        } else {
          busy = true;
          var f = first;
          first = null;
          setTimeout(function () {
            f.classList.remove("flipped");
            card.classList.remove("flipped");
            busy = false;
          }, 800);
        }
      }

      document.getElementById("restart").addEventListener("click", build);
      winRestartBtn.addEventListener("click", build);

      /* Theme Setup */
      let darkMode = localStorage.getItem('alok-theme-dark') === 'true';
      const themeBtn = document.getElementById('themeBtn');
      function setTheme() {
        document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
        if (themeBtn) themeBtn.textContent = darkMode ? '☀' : '☾';
        localStorage.setItem('alok-theme-dark', darkMode);
      }
      if (themeBtn) {
        themeBtn.addEventListener('click', function () {
          darkMode = !darkMode;
          setTheme();
        });
      }
      setTheme();
      build();
    </script>
    <script src="/js/firebase-tracker.js"></script>
  </body>
</html>
