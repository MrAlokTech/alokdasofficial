<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake — Alok Das Game Zone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  
  <style>
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 2.5rem;
    }
    .game-nav {
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      height: var(--nav-height);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      margin-bottom: 2rem;
    }
    .game-wrapper {
      max-width: 440px;
      width: 100%;
      padding: 0 1rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .arcade-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-pop);
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }
    .game-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .game-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .game-title-text {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
    }
    .score-badge-group {
      display: flex;
      gap: 12px;
    }
    .score-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 12px;
      color: var(--text2);
    }
    .score-pill span {
      color: var(--text);
      font-weight: 600;
      margin-left: 4px;
    }
    
    .canvas-frame {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface2);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.06);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    .game-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 1.5rem;
    }
    .overlay-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .overlay-sub {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: rgba(255,255,255,0.75);
      margin-bottom: 1.25rem;
    }
    .btn-action {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
      background: #ffffff;
      color: #111110;
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .btn-action:hover { opacity: 0.9; }
    
    /* Touch D-pad */
    .dpad-container {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }
    .dpad-row {
      display: flex;
      gap: 6px;
    }
    .dpad-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
      -webkit-user-select: none;
    }
    .dpad-btn:active {
      background: var(--accent);
      color: var(--bg);
    }
    .instructions {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text3);
      margin-top: 1.25rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <nav class="game-nav">
    <a href="/games" class="nav-logo">
      ALOK DAS <span class="nav-logo-tag">/ SNAKE</span>
    </a>
    <div class="nav-right-group">
      <a href="/games" class="header-back" title="Back to Games">← <span>Games</span></a>
      <button class="theme-toggle-btn" id="themeBtn" title="Toggle theme">☾</button>
    </div>
  </nav>

  <div class="game-wrapper">
    <div class="arcade-card">
      <div class="game-header">
        <div class="game-title-group">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
          <span class="game-title-text">Snake</span>
        </div>
        <div class="score-badge-group">
          <div class="score-pill">Score<span id="score">0</span></div>
          <div class="score-pill">Best<span id="best">0</span></div>
        </div>
      </div>

      <div class="canvas-frame">
        <canvas id="c" width="400" height="400"></canvas>

        <!-- Start Overlay -->
        <div class="game-overlay" id="start-overlay">
          <div class="overlay-title">Ready to Play?</div>
          <div class="overlay-sub">Use Arrow keys / WASD or D-pad below</div>
          <button class="btn-action" id="start-btn">Start Game →</button>
        </div>

        <!-- Game Over Overlay -->
        <div class="game-overlay" id="over-overlay" style="display:none;">
          <div class="overlay-title">Game Over</div>
          <div class="overlay-sub" id="over-score-text">Final Score: 0</div>
          <button class="btn-action" id="restart-btn">Play Again ↺</button>
        </div>
      </div>

      <!-- Touch D-Pad -->
      <div class="dpad-container">
        <div class="dpad-row">
          <button class="dpad-btn" data-dir="UP">▲</button>
        </div>
        <div class="dpad-row">
          <button class="dpad-btn" data-dir="LEFT">◀</button>
          <button class="dpad-btn" data-dir="DOWN">▼</button>
          <button class="dpad-btn" data-dir="RIGHT">▶</button>
        </div>
      </div>

      <div class="instructions">Use Arrow Keys, WASD, or Touch D-Pad</div>
    </div>
  </div>

<script>
var CELL=20,COLS=20,ROWS=20;
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
var startOverlay=document.getElementById('start-overlay'),overOverlay=document.getElementById('over-overlay'),overScoreText=document.getElementById('over-score-text');
var startBtn=document.getElementById('start-btn'),restartBtn=document.getElementById('restart-btn');

var snake,dir,nextDir,food,score,running,timer;
var best=parseInt(localStorage.getItem('snake_best')||'0');
bestEl.textContent=best;

function init(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  score=0;scoreEl.textContent=0;
  running=false;
  placeFood();draw();
}

function placeFood(){
  var ok=false;
  while(!ok){
    food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};
    ok=!snake.some(function(s){return s.x===food.x&&s.y===food.y;});
  }
}

function draw(){
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  ctx.fillStyle = isDark ? '#1c1c1a' : '#ffffff';
  ctx.fillRect(0,0,400,400);
  
  // Grid dots
  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.04)';
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    ctx.beginPath();ctx.arc(c*CELL+CELL/2,r*CELL+CELL/2,1.5,0,Math.PI*2);ctx.fill();
  }
  
  // Food pellet
  ctx.fillStyle='#e74c3c';
  ctx.beginPath();ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-3,0,Math.PI*2);ctx.fill();
  
  // Snake
  snake.forEach(function(seg,i){
    ctx.fillStyle = i===0 ? (isDark ? '#ffffff' : '#111110') : (isDark ? '#8a8880' : '#6b6860');
    ctx.beginPath();
    ctx.roundRect(seg.x*CELL+1.5,seg.y*CELL+1.5,CELL-3,CELL-3,i===0?5:4);
    ctx.fill();
  });
}

function step(){
  dir=nextDir;
  var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  head.x=(head.x+COLS)%COLS;head.y=(head.y+ROWS)%ROWS;
  if(snake.some(function(s){return s.x===head.x&&s.y===head.y;})){gameOver();return;}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score++;scoreEl.textContent=score;
    if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('snake_best',best);}
    placeFood();
  } else {snake.pop();}
  draw();
}

function gameOver(){
  running=false;clearInterval(timer);
  overScoreText.textContent='Final Score: '+score;
  overOverlay.style.display='flex';
  if(typeof window.trackEvent==='function'){
    window.trackEvent('game_over', 'Snake', { score: score });
  }
}

function startGame(){
  init();
  running=true;
  startOverlay.style.display='none';
  overOverlay.style.display='none';
  var speed=Math.max(80,150-score*5);
  clearInterval(timer);
  timer=setInterval(step,speed);
  if(typeof window.trackEvent==='function'){
    window.trackEvent('game_start', 'Snake', null);
  }
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

document.addEventListener('keydown',function(e){
  var map={'ArrowUp':{x:0,y:-1},'ArrowDown':{x:0,y:1},'ArrowLeft':{x:-1,y:0},'ArrowRight':{x:1,y:0},'w':{x:0,y:-1},'s':{x:0,y:1},'a':{x:-1,y:0},'d':{x:1,y:0}};
  var nd=map[e.key];
  if(!nd)return;
  e.preventDefault();
  if(!running){startGame();return;}
  if(nd.x===-dir.x&&nd.y===-dir.y)return;
  nextDir=nd;
});

document.querySelectorAll('[data-dir]').forEach(function(btn){
  btn.addEventListener('click',function(){
    var map={UP:{x:0,y:-1},DOWN:{x:0,y:1},LEFT:{x:-1,y:0},RIGHT:{x:1,y:0}};
    var nd=map[btn.getAttribute('data-dir')];
    if(!running){startGame();return;}
    if(nd.x===-dir.x&&nd.y===-dir.y)return;
    nextDir=nd;
  });
});

/* Theme Setup */
let darkMode = localStorage.getItem('alok-theme-dark') === 'true';
const themeBtn = document.getElementById('themeBtn');
function setTheme() {
  document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
  if (themeBtn) themeBtn.textContent = darkMode ? '☀' : '☾';
  localStorage.setItem('alok-theme-dark', darkMode);
  draw();
}
if (themeBtn) {
  themeBtn.addEventListener('click', function () {
    darkMode = !darkMode;
    setTheme();
  });
}
setTheme();
init();
</script>
<script src="/js/firebase-tracker.js"></script>
</body>
</html>
